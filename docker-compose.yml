services:
  # Java Sandbox Container - ejecuta código Java con límites de recurso
  java-sandbox:
    build:
      context: ./docker/java
      dockerfile: Dockerfile
    image: levcode-java:latest
    container_name: levcode-java-sandbox
    # No necesita estar "siempre corriendo" - se crea bajo demanda
    command: sleep infinity
    networks:
      - levcode-network
    # Límites de recursos para Mac Silicon
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Backend API Server - Node.js + Express
  # Se comunica con java-sandbox via Docker API
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile
    image: levcode-backend:latest
    container_name: levcode-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DOCKER_IMAGE=levcode-java:latest
      - JAVA_TIMEOUT=5000
      - JAVA_MEMORY=128m
      - JAVA_OUTPUT_MAX=10485760
      - DATABASE_URL=postgresql://localhost:5432/levcode
      - FRONTEND_URL=http://localhost:5173
      # ↑ Frontend corre en 5173 (Vite), no en 3000
    depends_on:
      - java-sandbox
    volumes:
      # Permite al Backend ejecutar docker commands
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - levcode-network
    # Healthcheck para backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  levcode-network:
    driver: bridge
