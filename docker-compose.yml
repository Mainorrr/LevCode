services:
  # Python sandbox image builder - construye la imagen y sale
  python-sandbox:
    build:
      context: ./docker/python
      dockerfile: Dockerfile
    image: levcode-python:latest
    container_name: levcode-python-builder
    entrypoint: ["echo", "Python sandbox image built successfully"]
    networks:
      - levcode-network

  # PostgreSQL - base de datos para sesiones de investigación
  postgres:
    image: postgres:16-alpine
    container_name: levcode-postgres
    environment:
      POSTGRES_DB: levcode
      POSTGRES_USER: levcode
      POSTGRES_PASSWORD: levcode
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - levcode-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U levcode"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Server - Node.js + Express
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile
    image: levcode-backend:latest
    container_name: levcode-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env.development
    environment:
      # Override: dentro de Docker, postgres es el hostname del servicio
      - DATABASE_URL=postgresql://levcode:levcode@postgres:5432/levcode
    depends_on:
      postgres:
        condition: service_healthy
      python-sandbox:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - levcode-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  levcode-network:
    driver: bridge

volumes:
  postgres-data:
