services:
  # PostgreSQL - base de datos para sesiones de investigación
  postgres:
    image: postgres:16-alpine
    container_name: levcode-postgres
    environment:
      POSTGRES_DB: levcode
      POSTGRES_USER: levcode
      POSTGRES_PASSWORD: levcode
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - levcode-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U levcode"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Server - Node.js + Express + Python 3
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile
    image: levcode-backend:latest
    container_name: levcode-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env.development
    environment:
      # Override: dentro de Docker, postgres es el hostname del servicio
      - DATABASE_URL=postgresql://levcode:levcode@postgres:5432/levcode
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src/log:/app/src/log
    networks:
      - levcode-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  levcode-network:
    driver: bridge

volumes:
  postgres-data:
