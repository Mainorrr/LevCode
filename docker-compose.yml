services:
  # Java sandbox container (builds Java image)
  java-sandbox:
    build:
      context: ./docker/java
      dockerfile: Dockerfile
    image: levcode-java:latest
    container_name: levcode-java-sandbox
    command: sleep infinity
    networks:
      - levcode-network

  # Backend API server
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: levcode-backend:latest
    container_name: levcode-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DOCKER_IMAGE=levcode-java:latest
      - JAVA_TIMEOUT=5000
      - JAVA_MEMORY=128m
      - DATABASE_URL=postgresql://localhost:5432/levcode
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - java-sandbox
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - levcode-network

networks:
  levcode-network:
    driver: bridge
